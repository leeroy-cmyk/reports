name: PropertyMeld Spokane Scheduler (Wade + Justin)

on:
  schedule:
    - cron: '0 13 * * *'   # 6:00 AM PDT, once per day
  workflow_dispatch:

concurrency:
  group: pm-spokane-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Spokane repair scheduler (Wade + Justin)
        env:
          PROPERTYMELD_EMAIL:    ${{ secrets.PROPERTYMELD_EMAIL }}
          PROPERTYMELD_PASSWORD: ${{ secrets.PROPERTYMELD_PASSWORD }}
        run: node pm_spokane_scheduler.js
