name: PropertyMeld Lawn Scheduler (David + Alexander)

on:
  schedule:
    - cron: '0 13 * * *'   # 6:00 AM PDT
    - cron: '0 21 * * *'   # 2:00 PM PDT (second daily pass for resilience)
  workflow_dispatch:

concurrency:
  group: pm-lawn-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run lawn scheduler (snaps recurring Lawn service melds to the canonical template week)
        env:
          PROPERTYMELD_EMAIL:    ${{ secrets.PROPERTYMELD_EMAIL }}
          PROPERTYMELD_PASSWORD: ${{ secrets.PROPERTYMELD_PASSWORD }}
        run: node pm_lawn_scheduler.js
