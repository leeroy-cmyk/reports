<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spokane Turn Schedule</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--navy:#1a5276;--blue:#2e86c1;--ink:#243746;--mut:#7b8a99;--line:#e6ebf0;--red:#c0392b;--amber:#b9770a;--green:#1e8449}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 16px 60px}
  .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  h1{color:var(--navy);margin:0;font-size:22px}
  .upd{color:var(--mut);font-size:12px}
  .kpis{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;min-width:92px}
  .kpi .n{font-size:20px;font-weight:700;color:var(--navy)}
  .kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
  .kpi.bad .n{color:var(--red)} .kpi.warn .n{color:var(--amber)} .kpi.good .n{color:var(--green)}
  .tabs{display:flex;flex-wrap:wrap;gap:2px;margin:16px 0 14px;border-bottom:2px solid var(--line)}
  .tab{padding:8px 15px;cursor:pointer;font-weight:600;color:var(--mut);border:2px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-2px}
  .tab.on{color:var(--navy);background:#fff;border-color:var(--line);border-bottom-color:#fff}
  .tab .badge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;margin-left:5px;font-weight:700}
  .pane{display:none} .pane.on{display:block}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  input.search,select{padding:5px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer;user-select:none;border:1px solid transparent}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.off{opacity:.32}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  th{background:#fcfdfe;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;white-space:nowrap;position:sticky;top:0}
  th.sortable:hover{color:var(--navy)}
  tbody tr:hover{background:#f7fafd}
  .tag{display:inline-block;padding:1px 8px;border-radius:11px;font-size:11px;font-weight:600}
  .prog{height:8px;background:#eef2f6;border-radius:5px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
  .prog>i{display:block;height:100%;background:var(--blue)}
  .flag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
  .f-risk{background:#fdecea;color:var(--red)} .f-ok{background:#eafaf0;color:var(--green)} .f-soon{background:#fff4e0;color:var(--amber)}
  /* calendar */
  .caltable{table-layout:fixed} .caltable th,.caltable td{border:1px solid var(--line);width:14.28%}
  .caltable td{height:92px} td.wknd{background:#fbfbfd} .td-fri{background:#faf7f0}
  .dn{font-weight:700;color:var(--navy);font-size:11px;margin-bottom:3px} .dn.today{color:var(--red)}
  .ev{display:block;border-left:3px solid #ccc;padding:1px 4px;margin-bottom:2px;font-size:11px;border-radius:2px;background:#fbfcfd}
  .ev .t{color:var(--mut)} .ev .u{font-weight:600}
  .ev.vendor .who{font-style:italic} .ev.suggested{border-left-style:dashed;background:#fffdf6} .ev.suggested .t{font-weight:700}
  .wkhdr{margin:16px 0 4px;color:var(--navy);font-weight:600;font-size:12px}
  .empty{color:var(--mut);padding:26px;text-align:center}
  .sec{margin:0 0 18px} .sec h3{margin:0 0 6px;font-size:14px} .sec .cnt{color:var(--mut);font-weight:400}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 0}
  .row{padding:6px 12px;border-bottom:1px solid var(--line);font-size:12.5px} .row:last-child{border:none}
  .muted{color:var(--mut)} .arw{color:var(--red);border-left:3px solid var(--red)} .aok{border-left:3px solid var(--green)}
  a.pm{color:var(--blue);text-decoration:none} a.pm:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Spokane Turn Schedule</h1><span class="upd" id="upd"></span></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div id="p-cal" class="pane"><div class="legend" id="legend" style="margin-bottom:12px"></div><div id="cal"></div></div>
  <div id="p-tasks" class="pane">
    <div class="bar">
      <input class="search" id="tSearch" placeholder="Search property, unit, task, person…" style="min-width:240px">
      <select id="tCat"></select><select id="tWho"></select>
      <label style="font-size:12px;color:var(--mut)"><input type="checkbox" id="tHidePast"> hide past</label>
    </div>
    <div id="tasksTbl"></div>
  </div>
  <div id="p-past" class="pane"><p class="sub muted">Tasks with a scheduled date before today, on melds not yet marked complete.</p><div id="pastTbl"></div></div>
  <div id="p-risk" class="pane"></div>
  <div id="p-turns" class="pane">
    <div class="bar"><input class="search" id="oSearch" placeholder="Search property / unit…" style="min-width:200px">
      <select id="oStatus"><option value="ACTIVE">Active turns</option><option value="all">All</option></select>
      <span class="muted" id="oCount"></span></div>
    <div id="turnsTbl"></div>
  </div>
  <div id="p-tech" class="pane"><div id="techView"></div></div>
</div>
<script>
const CATS={paint:{label:'Paint',color:'#8e44ad'},maintenance:{label:'Maintenance',color:'#c0392b'},walkthrough:{label:'Walkthrough',color:'#1f6bb0'},cleaning:{label:'Cleaning',color:'#16a085'},'suggested-cleaning':{label:'Sug. Cleaning',color:'#16a085'},carpet:{label:'Carpet',color:'#d68910'},'suggested-carpet':{label:'Sug. Carpet',color:'#d68910'},flooring:{label:'Flooring',color:'#7f8c8d'},other:{label:'Other',color:'#566573'}};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mondayOf=d=>{const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x;};
const fmtD=d=>(d.getMonth()+1)+'/'+d.getDate();
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pmLink=(id,txt)=>`<a class="pm" target="_blank" href="https://app.propertymeld.com/2975/m/2975/project/${id}/summary/">${esc(txt)}</a>`;
let DATA={events:[],turns:[],alerts:{},kpis:{}}, TODAY;
const active={};Object.keys(CATS).forEach(k=>active[k]=true);

const TABS=[
  {id:'cal',label:'Calendar'},{id:'tasks',label:'Tasks'},
  {id:'past',label:'Past Due',badge:()=>DATA.alerts.pastDue?.length||0},
  {id:'risk',label:'⚠ At-Risk',badge:()=>DATA.kpis.atRisk||0},
  {id:'turns',label:'Turns Overview'},{id:'tech',label:'Tech Workload'}];
function buildTabs(){
  document.getElementById('tabs').innerHTML=TABS.map((t,i)=>{const b=t.badge?t.badge():0;return `<div class="tab${i===0?' on':''}" data-id="${t.id}">${t.label}${b?`<span class="badge">${b}</span>`:''}</div>`;}).join('');
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));document.getElementById('p-'+el.dataset.id).classList.add('on');});
  document.getElementById('p-cal').classList.add('on');
}
function kpiRow(){
  const k=DATA.kpis;const cells=[['n','Open turns',k.openTurns,''],['n','Past due',k.pastDue,k.pastDue?'bad':'good'],['n','Unscheduled',k.unscheduled,k.unscheduled?'warn':'good'],['n','Fri viol.',k.fridayViol,k.fridayViol?'warn':'good'],['n','Move-in risk',k.moveInConflict,k.moveInConflict?'bad':'good'],['n','Stalled',k.stalled,k.stalled?'warn':'good']];
  document.getElementById('kpis').innerHTML=cells.map(c=>`<div class="kpi ${c[3]}"><div class="n">${c[2]??0}</div><div class="l">${c[1]}</div></div>`).join('');
}
/* ---------- Calendar ---------- */
function renderLegend(){const el=document.getElementById('legend');el.innerHTML=Object.entries(CATS).map(([k,c])=>`<span class="chip" data-k="${k}" style="background:${c.color}18;color:${c.color}"><span class="dot" style="background:${c.color}"></span>${c.label}</span>`).join('');el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{active[ch.dataset.k]=!active[ch.dataset.k];ch.classList.toggle('off',!active[ch.dataset.k]);renderCal();});}
function renderCal(){
  const floor=isoOf(new Date(new Date(TODAY+'T12:00:00').getTime()-7*864e5));
  const evs=DATA.events.filter(e=>active[e.category]!==false && e.date>=floor);
  const cal=document.getElementById('cal');if(!evs.length){cal.innerHTML='<div class="empty">No scheduled work in range.</div>';return;}
  const byDate={};evs.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const dates=evs.map(e=>e.date).sort();
  let start=mondayOf(new Date((dates[0]<TODAY?dates[0]:TODAY)+'T00:00:00'));const end=new Date(dates[dates.length-1]+'T00:00:00');
  let html='';
  for(let wk=new Date(start);wk<=end;wk.setDate(wk.getDate()+7)){const wkStart=new Date(wk);
    html+=`<div class="wkhdr">Week of ${fmtD(wkStart)}</div><table class="caltable"><tr>${DOW.slice(1).concat('Sun').map(d=>'<th>'+d+'</th>').join('')}</tr><tr>`;
    for(let i=0;i<7;i++){const d=new Date(wkStart);d.setDate(d.getDate()+i);const ds=isoOf(d);const wd=d.getDay();const cls=(wd===0||wd===6)?'wknd':(wd===5?'td-fri':'');
      const list=(byDate[ds]||[]).sort((a,b)=>(a.who||'').localeCompare(b.who||''));
      const cells=list.map(e=>{const c=CATS[e.category]||CATS.other;return `<span class="ev ${e.whoType}" style="border-left-color:${c.color}" title="${esc(e.brief)}"><span class="t">${e.start||'≈'}</span> <span class="u">${esc(e.prop)} #${esc(e.unit)}</span> <span style="color:${c.color}">${c.label}</span> · <span class="who">${esc(e.who)}</span></span>`;}).join('');
      html+=`<td class="${cls}"><div class="dn ${ds===TODAY?'today':''}">${DOW[wd]} ${fmtD(d)}${wd===5?' · buffer':''}</div>${cells}</td>`;}
    html+='</tr></table>';}
  cal.innerHTML=html;
}
/* ---------- generic sortable table ---------- */
function sortableTable(container,cols,rows,state){
  const th=cols.map((c,i)=>`<th class="sortable" data-i="${i}">${c.label}${state.sort===i?(state.dir>0?' ▲':' ▼'):''}</th>`).join('');
  const body=rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(c.html?c.html(r):esc(c.val(r)))+'</td>').join('')+'</tr>').join('');
  container.innerHTML=`<table><thead><tr>${th}</tr></thead><tbody>${body||'<tr><td colspan="'+cols.length+'" class="empty">Nothing here.</td></tr>'}</tbody></table>`;
  container.querySelectorAll('th.sortable').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(state.sort===i)state.dir*=-1;else{state.sort=i;state.dir=1;}state.render();});
}
/* ---------- Tasks ---------- */
const tState={sort:0,dir:1,render:renderTasks};
function taskRows(){
  const q=(document.getElementById('tSearch').value||'').toLowerCase();
  const cat=document.getElementById('tCat').value, who=document.getElementById('tWho').value, hidePast=document.getElementById('tHidePast').checked;
  let rows=DATA.events.filter(e=>(!cat||e.category===cat)&&(!who||e.who===who)&&(!hidePast||e.date>=TODAY));
  if(q)rows=rows.filter(e=>(e.prop+' '+e.unit+' '+e.brief+' '+e.who+' '+e.category).toLowerCase().includes(q));
  return rows;
}
function renderTasks(){
  const cols=[{label:'Date',val:r=>r.date,html:r=>`${r.date} <span class="muted">${DOW[new Date(r.date+'T12:00:00').getDay()]}</span>`},
    {label:'Time',val:r=>r.start||'≈'},{label:'Property',val:r=>r.prop},{label:'Unit',val:r=>r.unit},
    {label:'Category',val:r=>r.category,html:r=>{const c=CATS[r.category]||CATS.other;return `<span class="tag" style="background:${c.color}18;color:${c.color}">${c.label}</span>`;}},
    {label:'Task',val:r=>r.brief},{label:'Assigned',val:r=>r.who,html:r=>`${esc(r.who)} <span class="muted">${r.whoType}</span>`}];
  let rows=taskRows();const c=cols[tState.sort];rows.sort((a,b)=>{const x=c.val(a),y=c.val(b);return (x>y?1:x<y?-1:0)*tState.dir;});
  sortableTable(document.getElementById('tasksTbl'),cols,rows,tState);
}
/* ---------- Past Due ---------- */
function renderPast(){
  const pd=(DATA.alerts.pastDue||[]).slice().map(r=>({...r,over:daysBetween(r.date,TODAY)})).sort((a,b)=>b.over-a.over);
  const cols=[{label:'Scheduled',val:r=>r.date,html:r=>`${r.date} <span class="muted">${r.dow}</span>`},
    {label:'Days over',val:r=>r.over,html:r=>`<b style="color:var(--red)">${r.over}d</b>`},
    {label:'Property',val:r=>r.prop},{label:'Unit',val:r=>r.unit},{label:'Task',val:r=>r.task},
    {label:'Assigned',val:r=>r.who},{label:'Status',val:r=>r.status,html:r=>`<span class="muted">${esc(r.status)}</span>`},
    {label:'',val:r=>'',html:r=>pmLink(r.projId,'open ↗')}];
  const st={sort:1,dir:-1,render:renderPast};
  sortableTable(document.getElementById('pastTbl'),cols,pd,st);
}
/* ---------- At-Risk ---------- */
function renderRisk(){
  const a=DATA.alerts;const sections=[];
  const sec=(title,cls,items,fmt)=>{if(!items||!items.length)return '';return `<div class="sec"><h3>${title} <span class="cnt">· ${items.length}</span></h3><div class="card">${items.map(x=>`<div class="row ${cls}">${fmt(x)}</div>`).join('')}</div></div>`;};
  sections.push(sec('🚫 Move-in conflicts — work scheduled after move-in','arw',a.moveInConflict,x=>`<b>${esc(x.lbl)}</b> — last in-house <b>${x.lastInhouse}</b> is AFTER move-in <b>${x.mi}</b> &nbsp;${pmLink(x.projId,'open ↗')}`));
  sections.push(sec('📅 Unscheduled in-house work','arw',a.unscheduled,x=>`<b>${esc(x.lbl)}</b> — ${esc(x.task)} has no appointment <span class="muted">[${esc(x.status)}]</span> &nbsp;${pmLink(x.projId,'open ↗')}`));
  sections.push(sec('🐌 Stalled turns (overdue, ≤2 melds done)','arw',a.stalled,x=>`<b>${esc(x.lbl)}</b> — due ${x.due}, ${x.done}/${x.total} done &nbsp;${pmLink(x.projId,'open ↗')}`));
  sections.push(sec('⚠ Friday work (breaks Mon–Thu rule)','',a.friday,x=>`<b>${esc(x.lbl)}</b> — ${esc(x.task)} on <b>${x.date}</b> (Fri) &nbsp;${pmLink(x.projId,'open ↗')}`));
  sections.push(sec('⚠ Weekend work','',a.weekend,x=>`<b>${esc(x.lbl)}</b> — ${esc(x.task)} on ${x.date} (${x.dow}) &nbsp;${pmLink(x.projId,'open ↗')}`));
  sections.push(sec('ℹ️ Near-done but overdue (usually just final walkthrough)','aok',a.nearDone,x=>`<b>${esc(x.lbl)}</b> — due ${x.due}, ${x.done}/${x.total} done &nbsp;${pmLink(x.projId,'open ↗')}`));
  const html=sections.filter(Boolean).join('');
  document.getElementById('p-risk').innerHTML=html||'<div class="empty">No issues detected. 🎉</div>';
}
/* ---------- Turns Overview ---------- */
const oState={sort:5,dir:1,render:renderTurns};
function renderTurns(){
  const q=(document.getElementById('oSearch').value||'').toLowerCase();const stf=document.getElementById('oStatus').value;
  let rows=DATA.turns.filter(t=>(stf==='all'||t.status==='ACTIVE'));
  if(q)rows=rows.filter(t=>(t.prop+' '+t.unit).toLowerCase().includes(q));
  document.getElementById('oCount').textContent=rows.length+' turns';
  const dtl=t=>t.move_in?daysBetween(TODAY,t.move_in):null;
  const cols=[{label:'Property',val:t=>t.prop},{label:'Unit',val:t=>t.unit},
    {label:'Progress',val:t=>t.total?t.done/t.total:0,html:t=>`<span class="prog"><i style="width:${t.total?Math.round(t.done/t.total*100):0}%"></i></span> <span class="muted">${t.done}/${t.total}</span>`},
    {label:'Start',val:t=>t.start||''},{label:'Due',val:t=>t.due||''},
    {label:'Move-in',val:t=>t.move_in||'9999',html:t=>t.move_in?t.move_in:'<span class="muted">—</span>'},
    {label:'Days→',val:t=>dtl(t)==null?99999:dtl(t),html:t=>{const d=dtl(t);return d==null?'<span class="muted">—</span>':`<b>${d}d</b>`;}},
    {label:'Next task',val:t=>t.next_task?t.next_task.date:'zzz',html:t=>t.next_task?`${t.next_task.date} <span class="muted">${t.next_task.task}</span>`:'<span class="muted">none</span>'},
    {label:'Flag',val:t=>0,html:t=>{const d=dtl(t);const conflict=t.move_in&&t.last_inhouse&&t.last_inhouse>t.move_in;if(conflict)return '<span class="flag f-risk">MOVE-IN RISK</span>';if(t.status==='COMPLETE')return '<span class="flag f-ok">done</span>';if(d!=null&&d<=7)return '<span class="flag f-soon">move-in ≤7d</span>';return '<span class="flag f-ok">on track</span>';}},
    {label:'',val:t=>'',html:t=>pmLink(t.projId,'↗')}];
  const c=cols[oState.sort];rows.sort((a,b)=>{const x=c.val(a),y=c.val(b);return (x>y?1:x<y?-1:0)*oState.dir;});
  sortableTable(document.getElementById('turnsTbl'),cols,rows,oState);
}
/* ---------- Tech Workload ---------- */
function renderTech(){
  const floor=isoOf(new Date(new Date(TODAY+'T12:00:00').getTime()-7*864e5));
  const techEvents=DATA.events.filter(e=>e.whoType==='tech'&&e.date>=floor);
  const byTech={};techEvents.forEach(e=>{(byTech[e.who]=byTech[e.who]||[]).push(e);});
  const weekKey=ds=>{const m=mondayOf(new Date(ds+'T12:00:00'));return isoOf(m);};
  const weeks=[...new Set(techEvents.map(e=>weekKey(e.date)))].sort();
  let html='<p class="muted">Scheduled in-house task-days per tech (from 7 days ago forward). Unassigned = needs a tech.</p>';
  html+='<table><thead><tr><th>Tech</th><th>Total</th>'+weeks.map(w=>`<th>wk ${fmtD(new Date(w+'T12:00:00'))}</th>`).join('')+'</tr></thead><tbody>';
  Object.entries(byTech).sort((a,b)=>b[1].length-a[1].length).forEach(([tech,evs])=>{
    const wc={};evs.forEach(e=>{const w=weekKey(e.date);wc[w]=(wc[w]||0)+1;});
    const cells=weeks.map(w=>{const n=wc[w]||0;const bg=n>=8?'#fdecea':n>=5?'#fff4e0':n?'#eafaf0':'#fff';return `<td style="background:${bg}">${n||''}</td>`;}).join('');
    const nm=tech==='Unassigned'?`<b style="color:var(--red)">${tech}</b>`:esc(tech);
    html+=`<tr><td>${nm}</td><td><b>${evs.length}</b></td>${cells}</tr>`;});
  html+='</tbody></table>';
  document.getElementById('techView').innerHTML=html;
}
/* ---------- boot ---------- */
function fillFilters(){
  const cats=[...new Set(DATA.events.map(e=>e.category))].sort();
  document.getElementById('tCat').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option value="${c}">${(CATS[c]||{label:c}).label}</option>`).join('');
  const whos=[...new Set(DATA.events.map(e=>e.who))].sort();
  document.getElementById('tWho').innerHTML='<option value="">All people</option>'+whos.map(w=>`<option>${esc(w)}</option>`).join('');
  ['tSearch','tCat','tWho','tHidePast'].forEach(id=>document.getElementById(id).addEventListener('input',renderTasks));
  ['oSearch','oStatus'].forEach(id=>document.getElementById(id).addEventListener('input',renderTurns));
}
fetch('./data/turn_schedule.json?cb='+Date.now()).then(r=>r.json()).then(j=>{
  DATA=j;TODAY=j.today||new Date().toLocaleDateString('en-CA');
  const u=j.fetched_at?new Date(j.fetched_at):null;
  document.getElementById('upd').textContent='Updated '+(u?u.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+u.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'—')+' · '+(DATA.events||[]).length+' events · '+(DATA.kpis.openTurns||0)+' open turns';
  buildTabs();kpiRow();renderLegend();fillFilters();
  renderCal();renderTasks();renderPast();renderRisk();renderTurns();renderTech();
}).catch(e=>{document.getElementById('cal').innerHTML='<div class="empty">Could not load turn_schedule.json</div>';});
</script>
</body>
</html>
